name: Update Quant Data

on:
  schedule:
    # 매주 월~금, 한국 시간 오후 4시(장 마감 후) 자동 수집
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 버튼으로 언제든 실행 가능하게 함

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 저장소 소스코드 가져오기
        uses: actions/checkout@v3

      - name: 🐍 Python 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 필요 라이브러리 설치
        run: pip install requests

      - name: 🚀 데이터 수집 봇 실행
        run: python update_data.py

      - name: 💾 결과(JSON)를 GitHub에 저장 및 배포
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update quant data" && git push)
