name: Update Quant Data and Deploy Pages

on:
  schedule:
    # 매주 월~금, 한국 시간 기준 오전 9시부터 오후 8시까지 1시간 단위로 자동 실행 (UTC 기준 0시~11시)
    - cron: '0 0-11 * * 1-5'
  workflow_dispatch: # 수동 실행 버튼 활성화

# 저장소에 대한 권한 설정 (Pages 배포에 필수)
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 🐍 Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 필요 라이브러리 설치
        run: pip install requests

      - name: 🚀 데이터 수집 봇 실행
        run: python update_data.py

      - name: 💾 결과 파일(quant_data.json) 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update quant data" && git push)

      - name: ⚙️ GitHub Pages 설정 및 업로드
        uses: actions/configure-pages@v4
      
      - name: 📦 정적 파일 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # 현재 폴더 전체를 배포 대상으로 지정

      - name: 🚀 GitHub Pages 배포 실행
        id: deployment
        uses: actions/deploy-pages@v4
