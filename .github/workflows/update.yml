name: Update Quant Data

on:
  schedule:
    # 매주 월~금, 한국 시간 오후 4시(장 마감 후) 실행 (UTC 기준 07:00)
    - cron: '0 7 * * 1-5'
  workflow_dispatch: # GitHub 웹에서 수동으로 버튼을 눌러 실행할 수 있게 함

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스코드 가져오기
        uses: actions/checkout@v3

      - name: 🐍 Python 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 필요 라이브러리 설치
        run: pip install requests

      - name: 🚀 데이터 수집 스크립트 실행
        run: python update_data.py

      - name: 💾 결과물 GitHub에 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant_data.json
          # 변경사항이 있을 때만 커밋
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update quant data" && git push)
