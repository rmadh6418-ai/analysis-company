name: Update Quant Data and Deploy Pages

on:
  schedule:
    - cron: '0 0-11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 소스코드 가져오기
        uses: actions/checkout@v4

      - name: 🐍 Python 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 필수 라이브러리 설치
        run: pip install requests

      - name: 🚀 데이터 수집 봇 실행
        run: python update_data.py

      - name: 💾 결과 파일(quant_data.json) 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add quant_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update quant data" && git push)

      - name: ⚙️ GitHub Pages 설정
        uses: actions/configure-pages@v4
      
      - name: 📦 정적 파일 빌드
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 🚀 GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
