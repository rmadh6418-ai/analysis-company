name: Naver Finance Data Updater

on:
  schedule:
    # 한국 시간으로 매일 아침 9시, 오후 1시, 오후 4시에 자동 업데이트
    - cron: '0 0,4,7 * * *' 
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브에 파일을 쓸 수 있는 권한 부여

    steps:
    - name: 저장소 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: 데이터 업데이트 스크립트 실행
      run: python update_data.py

    - name: 업데이트된 데이터 파일 깃허브에 저장
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add naver_data.json
        git commit -m "Auto-update Naver Finance Data" || echo "No changes to commit"
        git push
