<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 투자 대시보드 (SECRET 경제연구소)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 한국 주식 차트 색상 적용: 상승은 빨강, 하락은 파랑 */
        .text-up { color: #ef4444; } 
        .text-down { color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- 헤더 및 검색 -->
        <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-gray-800">AI 퀀트 대시보드</h1>
            <div class="flex gap-2 w-full md:w-auto">
                <input type="text" id="ticker" placeholder="티커 입력 (예: AAPL, 005930.KS)" class="border p-2 rounded-lg flex-1">
                <button onclick="fetchData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">검색</button>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <input type="password" id="apiKey" placeholder="Gemini API Key (AI용)" class="border p-2 rounded-lg text-sm w-48">
            </div>
        </div>

        <!-- 주요 지표 카드 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="metrics-container">
            <!-- 데이터가 JS를 통해 여기에 채워집니다 -->
        </div>

        <!-- 심화 지표 및 컨센서스 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="font-bold text-lg mb-4">기업 가치 평가 (Valuation)</h2>
                <ul class="space-y-2 text-sm" id="valuation-data">
                    <li>데이터를 검색해주세요.</li>
                </ul>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="font-bold text-lg mb-4">정성적 분석 및 컨센서스</h2>
                <ul class="space-y-2 text-sm text-gray-600">
                    <li><span class="font-semibold text-gray-800">경제적 해자 (Morningstar):</span> <span id="moat-status">데이터 필요 (프리미엄 API/Scraping 요망)</span></li>
                    <li><span class="font-semibold text-gray-800">3년 컨센서스:</span> <span id="consensus-status">데이터 필요 (네이버 연동 요망)</span></li>
                </ul>
                <p class="text-xs text-gray-400 mt-4">* 해자 및 한국주식 컨센서스는 Python 스크래퍼 연동 필요</p>
            </div>
        </div>

        <!-- AI 분석 섹션 -->
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg">AI 딥다이브 분석</h2>
                <button onclick="runAIAnalysis()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 text-sm">AI 분석 실행</button>
            </div>
            <div id="ai-output" class="p-4 bg-gray-50 border rounded-lg min-h-[150px] text-gray-700 whitespace-pre-wrap">
                API 키를 우측 상단에 입력하고 분석 버튼을 누르면, 위 데이터를 기반으로 AI가 투자 의견을 제시합니다.
            </div>
        </div>
    </div>

    <script>
        let currentStockData = {};

        async function fetchData() {
            const ticker = document.getElementById('ticker').value.toUpperCase();
            if(!ticker) return alert('티커를 입력하세요.');
            
            // ★ 방금 복사한 구글 앱스 스크립트 웹 앱 URL을 아래에 붙여넣으세요! ★
            const gasProxyUrl = 'https://script.google.com/macros/s/AKfycbxNXhqPGjOPYTm_n9Cxk7DiRMmHqgc9kzRW_5u6lLqQIHzxnjUP6-zKrW0pY5t-nril/exec';
            
            try {
                // 구글 서버로 티커를 보내서 야후 데이터를 대신 받아오게 함
                const response = await fetch(`${gasProxyUrl}?ticker=${ticker}`);
                const json = await response.json();
                
                if (json.error || !json.quoteSummary) {
                    throw new Error("API 응답 오류 또는 데이터 없음");
                }
                
                const data = json.quoteSummary.result[0];
                const price = data.price;
                const fin = data.financialData;
                const stats = data.defaultKeyStatistics;

                currentStockData = {
                    ticker: ticker,
                    price: price.regularMarketPrice?.fmt || 'N/A',
                    per: fin.trailingPE?.fmt || 'N/A',
                    pbr: stats.priceToBook?.fmt || 'N/A',
                    revenue: fin.totalRevenue?.fmt || 'N/A',
                    opMargin: fin.operatingMargins?.fmt || 'N/A',
                    netMargin: fin.profitMargins?.fmt || 'N/A',
                    debtRatio: fin.debtToEquity?.fmt || 'N/A',
                    peg: stats.pegRatio?.fmt || 'N/A'
                };

                updateUI();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                alert("데이터를 불러오는데 실패했습니다. 티커를 확인하세요 (예: AAPL 또는 005930.KS).");
            }
        }

        function updateUI() {
            const d = currentStockData;
            
            document.getElementById('metrics-container').innerHTML = `
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">현재가</p>
                    <p class="text-xl font-bold">${d.price}</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">매출액</p>
                    <p class="text-xl font-bold">${d.revenue}</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">영업이익률</p>
                    <p class="text-xl font-bold">${(parseFloat(d.opMargin)*100).toFixed(2)}%</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">순이익률</p>
                    <p class="text-xl font-bold">${(parseFloat(d.netMargin)*100).toFixed(2)}%</p>
                </div>
            `;

            document.getElementById('valuation-data').innerHTML = `
                <li class="flex justify-between border-b pb-2"><span>PER (주가수익비율):</span> <span class="font-bold">${d.per}</span></li>
                <li class="flex justify-between border-b pb-2"><span>PBR (주가순자산비율):</span> <span class="font-bold">${d.pbr}</span></li>
                <li class="flex justify-between border-b pb-2"><span>PEG (성장조정 PER):</span> <span class="font-bold">${d.peg}</span></li>
                <li class="flex justify-between"><span>부채비율 (Debt to Equity):</span> <span class="font-bold">${d.debtRatio}%</span></li>
            `;
        }

        async function runAIAnalysis() {
            const apiKey = document.getElementById('apiKey').value;
            const output = document.getElementById('ai-output');
            
            if(!apiKey) return alert("우측 상단에 Gemini API Key를 입력해주세요.");
            if(!currentStockData.ticker) return alert("먼저 종목을 검색해주세요.");

            output.innerHTML = "AI 분석 중... 잠시만 기다려주세요.";

            const prompt = `너는 세계 최고의 주식 분석가야. 다음 기업의 데이터를 보고 투자자에게 통찰력 있는 분석을 제공해줘. 
            기업: ${currentStockData.ticker}, PER: ${currentStockData.per}, PBR: ${currentStockData.pbr}, 영업이익률: ${(parseFloat(currentStockData.opMargin)*100).toFixed(2)}%, 부채비율: ${currentStockData.debtRatio}%, PEG: ${currentStockData.peg}.
            이 지표들이 의미하는 바와 현재 주가의 고평가/저평가 여부, 재무 건전성을 3문단으로 짧고 굵게 요약해.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                output.innerHTML = data.candidates[0].content.parts[0].text;
            } catch(e) {
                output.innerHTML = "AI 분석 중 오류가 발생했습니다. API Key를 확인하세요.";
            }
        }
    </script>
</body>
</html>
