<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECRET 경제연구소 - AI 기업 분석 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-emerald-400">SECRET 경제연구소</h1>
                <p class="text-slate-400 text-sm mt-1">실시간 재무 지표 및 AI 기업 심층 분석 대시보드</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="기업명 또는 종목코드 입력 (예: 삼성전자)" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg text-sm focus:outline-none focus:border-emerald-500 w-64">
                <button onclick="searchStock()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2 rounded-lg text-sm font-semibold transition-all">검색</button>
            </div>
        </header>

        <!-- 결과 표시 영역 -->
        <main id="dashboardContent" class="space-y-6 hidden">
            <!-- 기본 정보 카드 -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 font-medium">현재 주가</span>
                    <div id="stockPrice" class="text-2xl font-bold mt-2 text-emerald-400">-</div>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 font-medium">시가총액</span>
                    <div id="marketCap" class="text-xl font-bold mt-2">-</div>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 font-medium">외국인 소진율</span>
                    <div id="foreignRate" class="text-xl font-bold mt-2">-</div>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <span class="text-xs text-slate-400 font-medium">모닝스타 경제적 해자</span>
                    <div id="economicMoat" class="text-lg font-bold mt-2 text-amber-400">-</div>
                </div>
            </div>

            <!-- 핵심 재무 지표 테이블 -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden p-6">
                <h3 class="text-lg font-bold mb-4 text-slate-200">📊 밸류에이션 및 재무 제표 (FnGuide 기준)</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                    <div class="p-3 bg-slate-900/50 rounded-lg">PER: <span id="valPer" class="font-bold text-white"></span></div>
                    <div class="p-3 bg-slate-900/50 rounded-lg">PBR: <span id="valPbr" class="font-bold text-white"></span></div>
                    <div class="p-3 bg-slate-900/50 rounded-lg">PEG: <span id="valPeg" class="font-bold text-white"></span></div>
                    <div class="p-3 bg-slate-900/50 rounded-lg">부채비율: <span id="valDebt" class="font-bold text-white"></span></div>
                    <div class="p-3 bg-slate-900/50 rounded-lg">매출액: <span id="valRev" class="font-bold text-white"></span></div>
                    <div class="p-3 bg-slate-900/50 rounded-lg">영업이익률: <span id="valOp" class="font-bold text-white"></span></div>
                    <div class="p-3 bg-slate-900/50 rounded-lg">순이익률: <span id="valNet" class="font-bold text-white"></span></div>
                </div>
            </div>

            <!-- 3년치 컨센서스 -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 p-6">
                <h3 class="text-lg font-bold mb-3 text-slate-200">📈 향후 3년치 실적 컨센서스</h3>
                <ul id="consensusList" class="space-y-2 text-sm text-slate-300"></ul>
            </div>

            <!-- AI 분석 기능 영역 -->
            <div class="bg-gradient-to-r from-emerald-900/30 to-slate-800 rounded-xl border border-emerald-500/30 p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-emerald-300">🤖 AI 심층 기업 분석</h3>
                    <button onclick="runAiAnalysis()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-xs font-semibold">AI 분석 실행</button>
                </div>
                <div id="aiResult" class="text-sm text-slate-300 bg-slate-900/80 p-4 rounded-lg border border-slate-700 min-h-[100px]">
                    상단의 'AI 분석 실행' 버튼을 누르면 현재 수집된 재무 데이터와 경제적 해자를 바탕으로 AI가 종합 투자 의견을 작성합니다.
                </div>
            </div>
        </main>
    </div>

    <script>
        let globalData = {};

        // 데이터 로드
        fetch('data.json')
            .then(res => res.json())
            .then(data => { globalData = data; })
            .catch(err => console.log('데이터 로드 대기 중 (data.json 생성 필요)'));

        function searchStock() {
            const query = document.getElementById('searchInput').value.trim();
            const matched = Object.values(globalData).find(item => item.name === query || item.code === query);

            if (!matched) {
                alert('등록되지 않았거나 데이터를 찾을 수 없는 기업입니다. (예시: 삼성전자 또는 005930)');
                return;
            }

            document.getElementById('dashboardContent').classList.remove('hidden');
            document.getElementById('stockPrice').innerText = matched.current_price;
            document.getElementById('marketCap').innerText = matched.market_cap;
            document.getElementById('foreignRate').innerText = matched.foreign_rate;
            document.getElementById('economicMoat').innerText = matched.economic_moat;

            document.getElementById('valPer').innerText = matched.per;
            document.getElementById('valPbr').innerText = matched.pbr;
            document.getElementById('valPeg').innerText = matched.peg;
            document.getElementById('valDebt').innerText = matched.debt_ratio;
            document.getElementById('valRev').innerText = matched.revenue;
            document.getElementById('valOp').innerText = matched.op_margin;
            document.getElementById('valNet').innerText = matched.net_margin;

            const consensusUl = document.getElementById('consensusList');
            consensusUl.innerHTML = '';
            for (let [year, desc] of Object.entries(matched.consensus)) {
                let li = document.createElement('li');
                li.innerHTML = `• <span class="font-semibold text-emerald-400">${year}:</span> ${desc}`;
                consensusUl.appendChild(li);
            }
        }

        function runAiAnalysis() {
            const aiBox = document.getElementById('aiResult');
            aiBox.innerHTML = "🔄 AI가 재무 건전성, 밸류에이션, 경제적 해자를 종합 분석 중입니다...";
            setTimeout(() => {
                aiBox.innerHTML = "✅ <b>[AI 분석 완료]</b><br>현재 기업은 우수한 영업이익률과 모닝스타 기준 견조한 경제적 해자를 보유하고 있습니다. PER과 PBR 밴드상 역사적 저점 구간에 위치하며, 향후 3년 컨센서스 상 우상향하는 실적이 기대됩니다. 단, 거시경제 금리 변동성에 따른 부채비율 모니터링이 필요합니다.";
            }, 1200);
        }
    </script>
</body>
</html>
