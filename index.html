<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECRET 기업 가치분석 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { krRed: '#ff3b30', krBlue: '#007aff' } } } }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-6">

    <div class="max-w-6xl mx-auto mb-8 text-center">
        <h1 class="text-3xl font-bold mb-6 text-gray-900">SECRET 기업 가치분석 대시보드</h1>
        <form id="searchForm" class="flex justify-center max-w-2xl mx-auto shadow-lg rounded-full overflow-hidden">
            <input type="text" id="searchInput" placeholder="기업명 입력 (예: 리노공업, 삼성전자, 알테오젠)" 
                   class="w-full px-6 py-4 text-lg focus:outline-none" required>
            <button type="submit" class="bg-gray-900 text-white px-8 py-4 font-bold hover:bg-gray-800 transition">검색</button>
        </form>
    </div>

    <div id="loading" class="text-center hidden my-10">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-gray-900 mx-auto"></div>
        <p class="mt-4 text-gray-600 font-medium">네이버 금융 데이터 불러오는 중...</p>
    </div>

    <div id="dashboard" class="max-w-6xl mx-auto hidden">
        <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 flex justify-between items-center border-l-4 border-gray-900">
            <div>
                <h2 id="companyName" class="text-4xl font-extrabold text-gray-900">기업명</h2>
                <p id="currentPrice" class="text-2xl mt-2 font-bold text-gray-600">현재가: -</p>
                <p id="targetPrice" class="text-lg mt-1 font-medium text-gray-500">목표주가: N/A</p>
                <p id="lastUpdate" class="text-xs text-gray-400 mt-2">업데이트: -</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-500 font-bold mb-1">Morningstar 기준: 경제적 해자 (Economic Moat)</p>
                <h3 id="moatLevel" class="text-3xl font-extrabold">-</h3>
                <p id="moatDesc" class="text-sm mt-2 text-gray-600 leading-relaxed">-</p>
            </div>
        </div>

        <h3 class="text-xl font-bold mb-4 text-gray-800">핵심 가치 지표</h3>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-8">
            <div class="card bg-white p-5 rounded-xl shadow-sm text-center">
                <p class="text-sm text-gray-500 font-medium">PER</p>
                <p id="valPer" class="text-2xl font-bold mt-1">-</p>
            </div>
            <div class="card bg-white p-5 rounded-xl shadow-sm text-center">
                <p class="text-sm text-gray-500 font-medium">PBR</p>
                <p id="valPbr" class="text-2xl font-bold mt-1">-</p>
            </div>
            <div class="card bg-white p-5 rounded-xl shadow-sm text-center">
                <p class="text-sm text-gray-500 font-medium">EPS</p>
                <p id="valEps" class="text-2xl font-bold mt-1">-</p>
            </div>
            <div class="card bg-white p-5 rounded-xl shadow-sm text-center">
                <p class="text-sm text-gray-500 font-medium">ROE</p>
                <p id="valRoe" class="text-2xl font-bold mt-1">-</p>
            </div>
            <div class="card bg-white p-5 rounded-xl shadow-sm text-center">
                <p class="text-sm text-gray-500 font-medium">PEG</p>
                <p id="valPeg" class="text-2xl font-bold mt-1 text-gray-400">N/A</p>
            </div>
            <div class="card bg-white p-5 rounded-xl shadow-sm text-center">
                <p class="text-sm text-gray-500 font-medium">부채비율</p>
                <p id="valDebt" class="text-2xl font-bold mt-1">-</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h3 class="text-xl font-bold mb-6 text-gray-800">최근 연간 실적 (TTM/컨센서스)</h3>
                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <span class="text-gray-600 font-medium">매출액</span>
                        <span id="valRev" class="text-xl font-bold text-gray-900">-</span>
                    </div>
                    <div class="flex justify-between items-center border-b pb-3">
                        <span class="text-gray-600 font-medium">영업이익</span>
                        <span id="valOp" class="text-xl font-bold text-gray-900">-</span>
                    </div>
                    <div class="flex justify-between items-center border-b pb-3">
                        <span class="text-gray-600 font-medium">영업이익률</span>
                        <span id="valOpMargin" class="text-xl font-bold">-</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-gray-600 font-medium">순이익률</span>
                        <span id="valNetMargin" class="text-xl font-bold">-</span>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h3 class="text-xl font-bold mb-4 text-gray-800">매출 및 영업이익 3년 추이</h3>
                <canvas id="consensusChart" height="200"></canvas>
            </div>
        </div>
    </div>

    <script>
        let myChart = null;

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // 입력값에서 공백 및 특수문자(따옴표 등) 완벽히 제거
            let rawQuery = document.getElementById('searchInput').value;
            const query = rawQuery.replace(/['"]/g, '').trim(); 
            
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('dashboard').classList.add('hidden');

            try {
                // 브라우저 캐시를 무시하고 최신 data.json을 강제로 가져오기
                const response = await fetch(`data.json?t=${new Date().getTime()}`, { cache: "no-store" });
                
                if (!response.ok) {
                    throw new Error(`HTTP 에러: ${response.status}`);
                }
                
                const db = await response.json();
                
                // 검색어 매칭 로직 (이름이나 티커에 포함되어 있는지 느슨하게 검사)
                const stockData = db[query] || Object.values(db).find(s => 
                    (s.name && s.name.includes(query)) || 
                    (s.ticker && s.ticker.includes(query))
                );

                if (stockData) {
                    renderDashboard(stockData);
                    document.getElementById('dashboard').classList.remove('hidden');
                } else {
                    alert(`[${query}] 기업 데이터가 없습니다.\n파이썬 코드(update_data.py)의 COMPANIES 목록에 있는지 확인해주세요.`);
                }
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                alert(`데이터를 불러올 수 없습니다.\n원인: ${error.message}\n(GitHub Actions에서 data.json이 정상 생성되었는지 확인해주세요.)`);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        });

        function renderDashboard(data) {
            document.getElementById('companyName').innerText = data.name || "-";
            document.getElementById('currentPrice').innerText = data.currentPrice ? `현재가: ${formatNumber(data.currentPrice)}원` : "현재가: -";
            document.getElementById('lastUpdate').innerText = `마지막 업데이트: ${data.last_updated || "-"}`;
            
            const targetEl = document.getElementById('targetPrice');
            if(data.targetPrice && data.targetPrice !== "-") {
                targetEl.innerText = `목표주가: ${formatNumber(data.targetPrice)}원`;
                targetEl.className = data.targetPrice > data.currentPrice ? "text-lg mt-1 font-bold text-krRed" : "text-lg mt-1 font-bold text-krBlue";
            } else {
                targetEl.innerText = "목표주가: N/A";
                targetEl.className = "text-lg mt-1 font-medium text-gray-500";
            }
            
            // 안전한 렌더링 (값이 없으면 N/A 처리)
            document.getElementById('valPer').innerText = (data.per && data.per !== "-") ? data.per + '배' : 'N/A';
            document.getElementById('valPbr').innerText = (data.pbr && data.pbr !== "-") ? data.pbr + '배' : 'N/A';
            document.getElementById('valEps').innerText = (data.eps && data.eps !== "-") ? formatNumber(data.eps) + '원' : 'N/A';
            document.getElementById('valRoe').innerText = (data.roe && data.roe !== "-") ? data.roe + '%' : 'N/A';
            document.getElementById('valDebt').innerText = (data.debtRatio && data.debtRatio !== "-") ? data.debtRatio + '%' : 'N/A';

            document.getElementById('valRev').innerText = (data.revenue && data.revenue !== "-") ? formatNumber(data.revenue) + '억 원' : 'N/A';
            document.getElementById('valOp').innerText = (data.operatingProfit && data.operatingProfit !== "-") ? formatNumber(data.operatingProfit) + '억 원' : 'N/A';
            
            colorizeMetric('valOpMargin', data.operatingMargin, '%');
            colorizeMetric('valNetMargin', data.netMargin, '%');

            renderMoat(data.roe);
            
            if(data.consensus && data.consensus.years && data.consensus.years.length > 0) {
                renderChart(data.consensus);
            } else {
                if (myChart) { myChart.destroy(); }
            }
        }

        // ... (나머지 renderMoat, renderChart, formatNumber, colorizeMetric 함수는 기존과 동일하게 유지합니다) ...
        
        function renderMoat(roe) {
            const levelEl = document.getElementById('moatLevel');
            const descEl = document.getElementById('moatDesc');
            
            if (roe === "-" || isNaN(roe) || !roe) {
                levelEl.innerText = "판별 불가";
                levelEl.className = "text-3xl font-extrabold text-gray-500";
                descEl.innerHTML = "재무 데이터가 부족하여 모닝스타 기준을 적용할 수 없습니다.";
            } else if (roe >= 15) {
                levelEl.innerText = "넓은 해자 (Wide Moat)";
                levelEl.className = "text-3xl font-extrabold text-krRed";
                descEl.innerHTML = "<b class='text-gray-800'>[모닝스타 기준 충족]</b> 강력한 무형자산, 네트워크 효과 등 보유<br><span class='text-xs text-gray-500'>(정량 프록시: 지속적 초과수익 달성 수준 - ROE 15% 이상)</span>";
            } else if (roe >= 10) {
                levelEl.innerText = "좁은 해자 (Narrow Moat)";
                levelEl.className = "text-3xl font-extrabold text-orange-500";
                descEl.innerHTML = "<b class='text-gray-800'>[모닝스타 기준 충족]</b> 일정 수준의 경쟁 우위 및 효율적 규모 확보<br><span class='text-xs text-gray-500'>(정량 프록시: 양호한 수익 달성 수준 - ROE 10% 이상)</span>";
            } else {
                levelEl.innerText = "해자 없음 (No Moat)";
                levelEl.className = "text-3xl font-extrabold text-krBlue";
                descEl.innerHTML = "<b class='text-gray-800'>[모닝스타 기준 미달]</b> 산업 내 진입장벽이 낮고 구조적 초과수익 달성 어려움<br><span class='text-xs text-gray-500'>(정량 프록시: 기본 수익 달성 미달 - ROE 10% 미만)</span>";
            }
        }

        function renderChart(consensus) {
            const ctx = document.getElementById('consensusChart').getContext('2d');
            if (myChart) { myChart.destroy(); }

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: consensus.years,
                    datasets: [
                        {
                            label: '매출액 (억 원)',
                            data: consensus.revenue,
                            backgroundColor: 'rgba(75, 85, 99, 0.7)',
                            borderRadius: 4
                        },
                        {
                            label: '영업이익 (억 원)',
                            data: consensus.opProfit,
                            type: 'line',
                            borderColor: '#ff3b30', 
                            backgroundColor: '#ff3b30',
                            borderWidth: 3,
                            tension: 0.3,
                            fill: false
                        }
                    ]
                },
                options: { responsive: true, scales: { y: { beginAtZero: false } } }
            });
        }

        function formatNumber(num) {
            if (num === "-" || isNaN(num) || num === null) return num;
            return new Intl.NumberFormat('ko-KR').format(num);
        }

        function colorizeMetric(elementId, value, suffix = '') {
            const el = document.getElementById(elementId);
            if (value === "-" || isNaN(value) || value === null) {
                el.innerText = "N/A";
                el.className = "text-xl font-bold text-gray-500";
                return;
            }
            el.innerText = value + suffix;
            el.className = value > 0 ? "text-xl font-bold text-krRed" : "text-xl font-bold text-krBlue";
        }
    </script>
</body>
</html>
