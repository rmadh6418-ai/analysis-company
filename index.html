<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 투자 대시보드 (네이버 금융 연동)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-up { color: #ef4444; } 
        .text-down { color: #3b82f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-800">

    <div class="w-72 bg-white border-r flex flex-col h-full shadow-sm z-10">
        <div class="p-5 border-b bg-green-600">
            <h1 class="text-xl font-bold text-white">SECRET 경제연구소</h1>
            <p class="text-green-100 text-sm mt-1">네이버 금융 AI 대시보드 (오류 제로 버전)</p>
        </div>
        <div class="p-4 overflow-y-auto flex-1" id="sidebar-menu"></div>
    </div>

    <div class="flex-1 flex flex-col h-full overflow-y-auto">
        <div class="p-6 max-w-6xl mx-auto w-full space-y-6">
            
            <div class="bg-white p-5 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="text-2xl font-bold" id="current-company">종목을 선택하세요</h2>
                    <span class="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded" id="current-ticker">TICKER</span>
                </div>
                
                <div class="flex flex-wrap gap-2 w-full md:w-auto justify-end">
                    <input type="text" id="manual-ticker" placeholder="종목명 검색 (예: 삼성전자)" class="border p-2 rounded-lg text-sm w-56 focus:outline-none focus:border-green-500">
                    <button onclick="searchManualTicker()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm font-semibold transition-colors mr-2">검색</button>
                    <input type="password" id="apiKey" placeholder="Gemini API Key 입력" class="border p-2 rounded-lg text-sm w-48 focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="metrics-container">
                <div class="col-span-4 bg-white p-8 rounded-xl shadow-sm text-center text-gray-400">
                    좌측 메뉴를 클릭하거나 상단에서 종목명을 직접 검색해주세요.
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-green-600">
                    <h3 class="font-bold text-lg mb-4 text-gray-700">네이버 기업 가치 평가 (Valuation)</h3>
                    <ul class="space-y-3 text-sm" id="valuation-data">
                        <li class="text-gray-400">데이터 대기 중...</li>
                    </ul>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-blue-500">
                    <h3 class="font-bold text-lg mb-4 text-gray-700">정성적 분석 및 추가 지표</h3>
                    <ul class="space-y-3 text-sm text-gray-600">
                        <li class="flex justify-between border-b pb-2"><span class="font-semibold">경제적 해자:</span> <span id="moat-status" class="text-gray-400">연동 예정</span></li>
                        <li class="flex justify-between"><span class="font-semibold">3년 컨센서스:</span> <span id="consensus-status" class="text-gray-400">연동 예정</span></li>
                    </ul>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-purple-600">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg text-gray-700">AI 딥다이브 분석</h3>
                    <button onclick="runAIAnalysis()" class="bg-purple-600 text-white px-5 py-2 rounded-lg hover:bg-purple-700 text-sm font-semibold transition-colors">AI 분석 실행</button>
                </div>
                <div id="ai-output" class="p-5 bg-gray-50 border rounded-lg min-h-[150px] text-gray-700 whitespace-pre-wrap leading-relaxed">우측 상단에 API 키를 입력하고 버튼을 누르면 Gemini AI가 분석을 시작합니다.</div>
            </div>
            <div class="h-10"></div> 
        </div>
    </div>

    <script>
        // 🚨 더 이상 구글 스크립트(가스 프록시)를 사용하지 않습니다. 통신 에러 완전 해결! 🚨
        
        let allStockData = {}; // 깃허브에 저장된 데이터를 불러와서 담을 변수
        let currentStockData = {};

        // 페이지 로드 시, 파이썬 로봇이 만들어둔 JSON 파일을 읽어옵니다!
        async function loadData() {
            try {
                // 저장소에 있는 정적 파일(naver_data.json)을 그냥 읽어오기만 하면 됩니다.
                const response = await fetch('./naver_data.json'); 
                if(!response.ok) throw new Error("JSON 파일을 찾을 수 없습니다. (Actions 봇을 실행했는지 확인하세요)");
                allStockData = await response.json();
                renderSidebar();
            } catch(e) {
                alert("데이터 로드 실패: " + e.message);
            }
        }

        // 메뉴 사이드바 생성 (불러온 데이터 기반으로 생성)
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            let html = '<div class="mb-6"><h2 class="text-sm font-extrabold text-gray-400 mb-2 pl-2 uppercase tracking-wider">주요 관심 종목</h2><div class="text-neutral-600 mt-1 mb-2 pl-2 flex flex-col">';
            
            for (const [code, info] of Object.entries(allStockData)) {
                html += `<button onclick="showData('${code}')" class="text-left py-1.5 px-3 text-sm hover:text-green-600 hover:bg-green-50 rounded-md transition-colors">${info.name}</button>`;
            }
            
            html += '</div></div>';
            sidebar.innerHTML = html;
        }

        // 수동 검색
        function searchManualTicker() {
            const query = document.getElementById('manual-ticker').value.trim();
            if(!query) return alert('종목명을 입력하세요.');

            // 이름으로 코드 찾기
            let targetCode = "";
            for (const [code, info] of Object.entries(allStockData)) {
                if(info.name === query || code === query) {
                    targetCode = code;
                    break;
                }
            }

            if(!targetCode) {
                alert(`'${query}' 데이터가 없습니다. 파이썬 코드(update_data.py)에 먼저 등록해주세요!`);
                return;
            }

            showData(targetCode);
        }

        document.getElementById('manual-ticker').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { searchManualTicker(); }
        });

        // 콤마 제거 등 안전한 숫자 포맷 함수
        function safeFormatNumber(val) {
            if (!val || val === "N/A" || val === "0") return val;
            const strVal = String(val).replace(/,/g, '');
            const num = Number(strVal);
            if (isNaN(num)) return strVal;
            return num.toLocaleString();
        }

        // 🚨 통신 없이 이미 불러온 데이터에서 바로 꺼내서 보여줌 (Failed to fetch 원천 차단)
        function showData(code) {
            const data = allStockData[code];
            if(!data) return;

            currentStockData = data;
            currentStockData.code = code;
            
            document.getElementById('current-company').innerText = data.name;
            document.getElementById('current-ticker').innerText = code;
            
            const fluctRaw = String(data.fluctuationsRatio).replace(/,/g, '').replace(/%/g, '');
            const fluctNum = parseFloat(fluctRaw) || 0;
            
            const isUp = fluctNum > 0;
            const isDown = fluctNum < 0;
            const colorClass = isUp ? 'text-up' : (isDown ? 'text-down' : 'text-gray-800');
            const sign = isUp ? '+' : '';

            document.getElementById('metrics-container').innerHTML = `
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-500 flex flex-col justify-center">
                    <p class="text-sm text-gray-500 mb-1">현재가</p>
                    <p class="text-2xl font-bold ${colorClass}">${safeFormatNumber(data.price)}원</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-400 flex flex-col justify-center">
                    <p class="text-sm text-gray-500 mb-1">전일비 (등락률)</p>
                    <p class="text-xl font-bold ${colorClass}">${sign}${safeFormatNumber(data.compareToPreviousPrice)} (${sign}${data.fluctuationsRatio}%)</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-400 flex flex-col justify-center">
                    <p class="text-sm text-gray-500 mb-1">시가총액</p>
                    <p class="text-xl font-bold text-gray-800">${data.marketSum}</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-purple-400 flex flex-col justify-center">
                    <p class="text-sm text-gray-500 mb-1">외국인 소진율</p>
                    <p class="text-xl font-bold text-gray-800">${data.foreignRatio}%</p>
                </div>
            `;

            document.getElementById('valuation-data').innerHTML = `
                <li class="flex justify-between border-b pb-3"><span class="text-gray-600">PER (주가수익비율)</span> <span class="font-bold text-gray-800">${data.per} 배</span></li>
                <li class="flex justify-between border-b pb-3 pt-1"><span class="text-gray-600">PBR (주가순자산비율)</span> <span class="font-bold text-gray-800">${data.pbr} 배</span></li>
                <li class="flex justify-between border-b pb-3 pt-1"><span class="text-gray-600">EPS (주당순이익)</span> <span class="font-bold text-gray-800">${data.eps} 원</span></li>
                <li class="flex justify-between pt-1"><span class="text-gray-600">배당수익률</span> <span class="font-bold text-gray-800">${data.dividendYield} %</span></li>
            `;
        }

        async function runAIAnalysis() {
            const apiKey = document.getElementById('apiKey').value;
            const output = document.getElementById('ai-output');
            
            if(!apiKey) return alert("우측 상단에 Gemini API Key를 입력해주세요.");
            if(!currentStockData.code) return alert("종목을 먼저 검색해주세요.");

            output.innerHTML = '<div class="flex items-center text-purple-600"><div class="animate-spin rounded-full h-5 w-5 border-b-2 border-purple-600 mr-2"></div>AI가 분석 중입니다...</div>';

            const prompt = `너는 퀀트 기반 주식 분석가야. 
            기업: ${currentStockData.name}, 현재가: ${currentStockData.price}, PER: ${currentStockData.per}, PBR: ${currentStockData.pbr}, EPS: ${currentStockData.eps}, 배당: ${currentStockData.dividendYield}%.
            이 지표들이 의미하는 바와 고평가/저평가 여부를 짧고 굵게 요약해.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-900">$1</strong>');
                output.innerHTML = text;
            } catch(e) {
                output.innerHTML = `<span class="text-red-500">AI 분석 에러: ${e.message}</span>`;
            }
        }

        window.onload = loadData; // 시작 시 데이터 파일(JSON)을 불러옵니다.
    </script>
</body>
</html>
