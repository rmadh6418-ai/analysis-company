            let html = '';

            for (const [market, sectors] of Object.entries(stockPortfolio)) {
                html += `<div class="mb-6"><h2 class="text-sm font-extrabold text-gray-400 mb-2 pl-2 uppercase tracking-wider">${market}</h2>`;

        // 검색 기능 (종목코드 6자리 OR 한글 종목명 완벽 지원!)
        function searchManualTicker() {
            const query = document.getElementById('manual-ticker').value.trim();
            if(!query) return alert('종목명 또는 종목코드를 입력하세요.');

            let targetCode = "";
            let targetName = "";

            if (query.match(/^\d{6}$/)) {
                targetCode = query;
                targetName = "검색종목"; 
            } else {
                const foundCode = nameToCodeMap[query] || nameToCodeMap[query.toUpperCase()];
                if (foundCode) {
                    targetCode = foundCode;
                    targetName = query;
                } else {
                    return alert(`'${query}' 종목을 찾을 수 없습니다. 정확한 한글 이름이나 6자리 종목코드를 입력해주세요.`);
                }
            }
            fetchData(targetCode, targetName);
        }

        document.getElementById('manual-ticker').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { searchManualTicker(); }
        });

        async function fetchData(code, displayName) {
            document.getElementById('metrics-container').innerHTML = '<div class="col-span-4 flex justify-center py-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-green-600"></div><span class="ml-3 text-green-600 font-medium my-auto">데이터를 가져오는 중...</span></div>';
            
            try {
                const response = await fetch(`${gasProxyUrl}?code=${code}`);
                const data = await response.json();
                
                if (data.error) throw new Error(data.error);

                currentStockData = data;
                
                document.getElementById('current-company').innerText = data.name !== "이름없음" ? data.name : displayName;
                document.getElementById('current-ticker').innerText = data.code;
                
                const isUp = parseFloat(data.fluctuationsRatio) > 0;
                const isDown = parseFloat(data.fluctuationsRatio) < 0;
                const colorClass = isUp ? 'text-up' : (isDown ? 'text-down' : 'text-gray-800');
                const sign = isUp ? '+' : '';

                // 숫자 콤마 및 포맷팅 처리 안전화
                const priceStr = (data.price || "0").toString().replace(/,/g, '');
                const compareStr = (data.compareToPreviousPrice || "0").toString().replace(/,/g, '');
                const marketSum = data.marketSum !== "N/A" ? data.marketSum : "N/A";

                document.getElementById('metrics-container').innerHTML = `
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-500 flex flex-col justify-center">
                        <p class="text-sm text-gray-500 mb-1">현재가</p>
                        <p class="text-2xl font-bold ${colorClass}">${Number(priceStr).toLocaleString()}원</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-400 flex flex-col justify-center">
                        <p class="text-sm text-gray-500 mb-1">전일비 (등락률)</p>
                        <p class="text-xl font-bold ${colorClass}">${sign}${Number(compareStr).toLocaleString()} (${sign}${data.fluctuationsRatio}%)</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-400 flex flex-col justify-center">
                        <p class="text-sm text-gray-500 mb-1">시가총액</p>
                        <p class="text-xl font-bold text-gray-800">${marketSum}</p>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-purple-400 flex flex-col justify-center">
                        <p class="text-sm text-gray-500 mb-1">외국인 소진율</p>
                        <p class="text-xl font-bold text-gray-800">${data.foreignRatio}%</p>
                    </div>
                `;

                document.getElementById('valuation-data').innerHTML = `
                    <li class="flex justify-between border-b pb-3"><span class="text-gray-600">PER (주가수익비율)</span> <span class="font-bold text-gray-800">${data.per} 배</span></li>
                    <li class="flex justify-between border-b pb-3 pt-1"><span class="text-gray-600">PBR (주가순자산비율)</span> <span class="font-bold text-gray-800">${data.pbr} 배</span></li>
                    <li class="flex justify-between border-b pb-3 pt-1"><span class="text-gray-600">EPS (주당순이익)</span> <span class="font-bold text-gray-800">${data.eps} 원</span></li>
                    <li class="flex justify-between pt-1"><span class="text-gray-600">배당수익률</span> <span class="font-bold text-gray-800">${data.dividendYield} %</span></li>
                `;
            } catch (error) {
                document.getElementById('metrics-container').innerHTML = `<div class="col-span-4 text-center text-red-500 font-bold p-6 bg-red-50 rounded-xl border border-red-100">데이터 로드 실패: ${error.message}</div>`;
            }
        }

        async function runAIAnalysis() {
            const apiKey = document.getElementById('apiKey').value;
            const output = document.getElementById('ai-output');
            
            if(!apiKey) return alert("우측 상단에 Gemini API Key를 입력해주세요.");
            if(!currentStockData.code) return alert("종목을 먼저 검색해주세요.");

            output.innerHTML = '<div class="flex items-center text-purple-600"><div class="animate-spin rounded-full h-5 w-5 border-b-2 border-purple-600 mr-2"></div>AI가 네이버 데이터를 분석 중입니다...</div>';

            const prompt = `너는 퀀트 기반의 주식 분석가야. 다음 기업의 실시간 네이버 금융 데이터를 바탕으로 투자자에게 분석을 제공해줘. 
            기업: ${currentStockData.name}, 현재가: ${currentStockData.price}, 시가총액: ${currentStockData.marketSum}, PER: ${currentStockData.per}, PBR: ${currentStockData.pbr}, EPS: ${currentStockData.eps}, 배당수익률: ${currentStockData.dividendYield}%.
            이 지표들이 의미하는 바와 고평가/저평가 여부를 3문단으로 짧고 굵게 요약해.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-900">$1</strong>');
                output.innerHTML = text;
            } catch(e) {
                output.innerHTML = `<span class="text-red-500">AI 분석 중 오류가 발생했습니다: ${e.message}</span>`;
            }
        }

        window.onload = renderSidebar;
    </script>
</body>
</html>
