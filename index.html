<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 투자 대시보드 (SECRET 경제연구소)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-up { color: #ef4444; } 
        .text-down { color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- 헤더 및 검색 -->
        <div class="bg-white p-6 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-gray-800">AI 퀀트 대시보드</h1>
            <div class="flex gap-2 w-full md:w-auto">
                <input type="text" id="ticker" placeholder="티커 입력 (예: AAPL, 005930.KS)" class="border p-2 rounded-lg flex-1">
                <button onclick="fetchData()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">검색</button>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
                <input type="password" id="apiKey" placeholder="Gemini API Key (AI용)" class="border p-2 rounded-lg text-sm w-48">
            </div>
        </div>

        <!-- 주요 지표 카드 -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="metrics-container">
            <!-- 데이터가 JS를 통해 여기에 채워집니다 -->
        </div>

        <!-- 심화 지표 및 컨센서스 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="font-bold text-lg mb-4">기업 가치 평가 (Valuation)</h2>
                <ul class="space-y-2 text-sm" id="valuation-data">
                    <li>데이터를 검색해주세요.</li>
                </ul>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm">
                <h2 class="font-bold text-lg mb-4">정성적 분석 및 컨센서스</h2>
                <ul class="space-y-2 text-sm text-gray-600">
                    <li><span class="font-semibold text-gray-800">경제적 해자 (Morningstar):</span> <span id="moat-status">데이터 필요</span></li>
                    <li><span class="font-semibold text-gray-800">3년 컨센서스:</span> <span id="consensus-status">데이터 필요</span></li>
                </ul>
            </div>
        </div>

        <!-- AI 분석 섹션 -->
        <div class="bg-white p-6 rounded-xl shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-lg">AI 딥다이브 분석</h2>
                <button onclick="runAIAnalysis()" class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 text-sm">AI 분석 실행</button>
            </div>
            <div id="ai-output" class="p-4 bg-gray-50 border rounded-lg min-h-[150px] text-gray-700 whitespace-pre-wrap">API 키를 우측 상단에 입력하고 분석 버튼을 누르면, 위 데이터를 기반으로 AI가 투자 의견을 제시합니다.</div>
        </div>
    </div>

    <script>
        let currentStockData = {};

        async function fetchData() {
            const ticker = document.getElementById('ticker').value.toUpperCase().trim();
            if(!ticker) return alert('티커를 입력하세요.');
            
            // 🚨 [필수 확인] 아래 주소를 본인이 만든 구글 앱스 스크립트 웹 앱 주소로 변경하세요!
            // 예시: const gasProxyUrl = 'https://script.google.com/macros/s/AKfycbyABCD1234/exec';
            const gasProxyUrl = 'https://script.google.com/macros/s/AKfycbyT1sEqVFxYURnIqzAm6lvFMCMZiVspeSTe3BjQ2ktrSi0PPDirb40fLGANoVc5Umsx/exec';

            document.getElementById('metrics-container').innerHTML = '<p class="col-span-4 text-center text-blue-600 font-bold p-4">데이터를 불러오는 중입니다...</p>';

            try {
                const response = await fetch(`${gasProxyUrl}?ticker=${ticker}`);
                
                if (!response.ok) throw new Error(`HTTP 통신 에러 (상태 코드: ${response.status})`);
                
                const text = await response.text();
                let json;
                try {
                    json = JSON.parse(text);
                } catch(e) {
                    throw new Error("🚨 [에러 원인 2] 구글 스크립트 배포 시 액세스 권한을 '모든 사용자(Anyone)'로 설정하지 않았습니다. 권한을 수정하고 '새 배포'를 다시 진행하세요.");
                }
                
                if (json.error) throw new Error(`API 내부 에러: ${json.error}`);
                if (!json.quoteSummary || !json.quoteSummary.result) throw new Error(`야후 파이낸스에서 '${ticker}' 데이터를 찾을 수 없거나 차단되었습니다.`);
                
                const data = json.quoteSummary.result[0];
                const price = data.price || {};
                const fin = data.financialData || {};
                const stats = data.defaultKeyStatistics || {};

                currentStockData = {
                    ticker: ticker,
                    price: price.regularMarketPrice?.fmt || 'N/A',
                    per: fin.trailingPE?.fmt || 'N/A',
                    pbr: stats.priceToBook?.fmt || 'N/A',
                    revenue: fin.totalRevenue?.fmt || 'N/A',
                    opMargin: fin.operatingMargins?.fmt || 'N/A',
                    netMargin: fin.profitMargins?.fmt || 'N/A',
                    debtRatio: fin.debtToEquity?.fmt || 'N/A',
                    peg: stats.pegRatio?.fmt || 'N/A'
                };

                updateUI();
            } catch (error) {
                console.error("데이터 로드 실패:", error);
                document.getElementById('metrics-container').innerHTML = `<p class="col-span-4 text-center text-red-600 font-bold p-4">${error.message}</p>`;
                alert(error.message);
            }
        }

        function updateUI() {
            const d = currentStockData;
            
            document.getElementById('metrics-container').innerHTML = `
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">현재가</p>
                    <p class="text-xl font-bold">${d.price}</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">매출액</p>
                    <p class="text-xl font-bold">${d.revenue}</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">영업이익률</p>
                    <p class="text-xl font-bold">${d.opMargin !== 'N/A' ? (parseFloat(d.opMargin)*100).toFixed(2) + '%' : 'N/A'}</p>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-gray-500">순이익률</p>
                    <p class="text-xl font-bold">${d.netMargin !== 'N/A' ? (parseFloat(d.netMargin)*100).toFixed(2) + '%' : 'N/A'}</p>
                </div>
            `;

            document.getElementById('valuation-data').innerHTML = `
                <li class="flex justify-between border-b pb-2"><span>PER (주가수익비율):</span> <span class="font-bold">${d.per}</span></li>
                <li class="flex justify-between border-b pb-2"><span>PBR (주가순자산비율):</span> <span class="font-bold">${d.pbr}</span></li>
                <li class="flex justify-between border-b pb-2"><span>PEG (성장조정 PER):</span> <span class="font-bold">${d.peg}</span></li>
                <li class="flex justify-between"><span>부채비율 (Debt to Equity):</span> <span class="font-bold">${d.debtRatio !== 'N/A' ? d.debtRatio + '%' : 'N/A'}</span></li>
            `;
        }

        async function runAIAnalysis() {
            const apiKey = document.getElementById('apiKey').value;
            const output = document.getElementById('ai-output');
            
            if(!apiKey) return alert("우측 상단에 Gemini API Key를 입력해주세요.");
            if(!currentStockData.ticker) return alert("먼저 종목을 검색해주세요.");

            output.innerHTML = "AI 분석 중... 잠시만 기다려주세요.";

            const prompt = `너는 세계 최고의 주식 분석가야. 다음 기업의 데이터를 보고 투자자에게 통찰력 있는 분석을 제공해줘. 
            기업: ${currentStockData.ticker}, PER: ${currentStockData.per}, PBR: ${currentStockData.pbr}, 영업이익률: ${currentStockData.opMargin !== 'N/A' ? (parseFloat(currentStockData.opMargin)*100).toFixed(2)+'%' : 'N/A'}, 부채비율: ${currentStockData.debtRatio}, PEG: ${currentStockData.peg}.
            이 지표들이 의미하는 바와 현재 주가의 고평가/저평가 여부, 재무 건전성을 3문단으로 짧고 굵게 요약해.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                output.innerHTML = data.candidates[0].content.parts[0].text;
            } catch(e) {
                output.innerHTML = `<span class="text-red-500">AI 분석 중 오류가 발생했습니다: ${e.message}</span>`;
            }
        }
    </script>
</body>
</html>
