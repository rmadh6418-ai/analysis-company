<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 투자 대시보드 (SECRET 경제연구소)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .text-up { color: #ef4444; } 
        .text-down { color: #3b82f6; }
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="bg-gray-50 flex h-screen overflow-hidden text-gray-800">

    <!-- 좌측 사이드바 (종목 선택기) -->
    <div class="w-72 bg-white border-r flex flex-col h-full shadow-sm z-10">
        <div class="p-5 border-b bg-blue-600">
            <h1 class="text-xl font-bold text-white">SECRET 경제연구소</h1>
            <p class="text-blue-100 text-sm mt-1">AI 퀀트 대시보드</p>
        </div>
        <div class="p-4 overflow-y-auto flex-1" id="sidebar-menu">
            <!-- JS로 섹터별 메뉴가 자동 생성됩니다 -->
        </div>
    </div>

    <!-- 우측 메인 컨텐츠 영역 -->
    <div class="flex-1 flex flex-col h-full overflow-y-auto">
        <div class="p-6 max-w-6xl mx-auto w-full space-y-6">
            
            <!-- 상단 헤더 & 컨트롤 -->
            <div class="bg-white p-5 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <h2 class="text-2xl font-bold" id="current-company">종목을 선택하세요</h2>
                    <span class="text-sm text-gray-500 bg-gray-100 px-2 py-1 rounded" id="current-ticker">TICKER</span>
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <input type="password" id="apiKey" placeholder="Gemini API Key 입력" class="border p-2 rounded-lg text-sm w-56 focus:outline-none focus:border-blue-500">
                </div>
            </div>

            <!-- 주요 지표 카드 -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="metrics-container">
                <div class="col-span-4 bg-white p-8 rounded-xl shadow-sm text-center text-gray-400">
                    좌측 메뉴에서 분석할 기업을 선택해주세요.
                </div>
            </div>

            <!-- 심화 지표 및 컨센서스 -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-blue-600">
                    <h3 class="font-bold text-lg mb-4 text-gray-700">기업 가치 평가 (Valuation)</h3>
                    <ul class="space-y-3 text-sm" id="valuation-data">
                        <li class="text-gray-400">데이터 대기 중...</li>
                    </ul>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-green-500">
                    <h3 class="font-bold text-lg mb-4 text-gray-700">정성적 분석 및 컨센서스</h3>
                    <ul class="space-y-3 text-sm text-gray-600">
                        <li class="flex justify-between border-b pb-2"><span class="font-semibold">경제적 해자:</span> <span id="moat-status" class="text-gray-400">연동 예정</span></li>
                        <li class="flex justify-between"><span class="font-semibold">3년 컨센서스:</span> <span id="consensus-status" class="text-gray-400">연동 예정</span></li>
                    </ul>
                </div>
            </div>

            <!-- AI 분석 섹션 -->
            <div class="bg-white p-6 rounded-xl shadow-sm border-t-4 border-purple-600">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-lg text-gray-700">AI 딥다이브 분석</h3>
                    <button onclick="runAIAnalysis()" class="bg-purple-600 text-white px-5 py-2 rounded-lg hover:bg-purple-700 text-sm font-semibold transition-colors">AI 분석 실행</button>
                </div>
                <div id="ai-output" class="p-5 bg-gray-50 border rounded-lg min-h-[150px] text-gray-700 whitespace-pre-wrap leading-relaxed">우측 상단에 API 키를 입력하고 버튼을 누르면 Gemini AI가 투자 통찰력을 제공합니다.</div>
            </div>
            
            <div class="h-10"></div> <!-- 하단 여백 -->
        </div>
    </div>

    <script>
        // 🚨 [필수 확인] 반드시 본인의 구글 스크립트 웹 앱 주소로 변경하세요!
        const gasProxyUrl = 'https://script.google.com/macros/s/AKfycbyT1sEqVFxYURnIqzAm6lvFMCMZiVspeSTe3BjQ2ktrSi0PPDirb40fLGANoVc5Umsx/exec';

        // 파이썬 딕셔너리 구조를 적용한 주식 데이터 매핑 (KOSPI는 .KS, KOSDAQ은 .KQ)
        const stockPortfolio = {
            "KOSPI 200": {
                "화학·에너지": { "LG화학": "051910.KS", "S-Oil": "010950.KS", "SK이노베이션": "096770.KS", "롯데케미칼": "011170.KS" },
                "이차전지·배터리": { "LG에너지솔루션": "373220.KS", "POSCO홀딩스": "005490.KS", "삼성SDI": "006400.KS", "포스코퓨처엠": "003670.KS", "에코프로머티": "450080.KS" },
                "전기·전자 (반도체/IT)": { "삼성전자": "005930.KS", "SK하이닉스": "000660.KS", "삼성전기": "009150.KS", "LG이노텍": "011070.KS", "한미반도체": "042700.KS" },
                "자동차·운송장비": { "현대차": "005380.KS", "기아": "000270.KS", "현대모비스": "012330.KS", "현대오토에버": "307950.KS" },
                "제약·바이오": { "삼성바이오로직스": "207940.KS", "셀트리온": "068270.KS", "유한양행": "000100.KS", "한미약품": "128940.KS", "SK바이오팜": "326030.KS" },
                "금융·지주": { "KB금융": "105560.KS", "신한지주": "055550.KS", "하나금융지주": "086790.KS", "우리금융지주": "316140.KS" },
                "인터넷·게임": { "NAVER": "035420.KS", "카카오": "035720.KS", "크래프톤": "259960.KS", "엔씨소프트": "036570.KS" }
            },
            "KOSDAQ 150": {
                "제약·바이오": { "알테오젠": "196170.KQ", "HLB": "028300.KQ", "삼천당제약": "000250.KQ", "리가켐바이오": "141080.KQ" },
                "이차전지·소재": { "에코프로비엠": "247540.KQ", "에코프로": "086520.KQ", "엔켐": "348370.KQ" },
                "반도체 소부장": { "HPSP": "403870.KQ", "리노공업": "058470.KQ", "이오테크닉스": "039280.KQ", "주성엔지니어링": "036930.KQ" },
                "엔터·미디어": { "JYP Ent.": "035900.KQ", "에스엠": "041510.KQ", "CJ ENM": "035760.KQ", "스튜디오드래곤": "253450.KQ" }
            }
        };

        let currentStockData = {};

        // 사이드바 메뉴 렌더링 함수
        function renderSidebar() {
            const sidebar = document.getElementById('sidebar-menu');
            let html = '';

            for (const [market, sectors] of Object.entries(stockPortfolio)) {
                html += `<div class="mb-6"><h2 class="text-sm font-extrabold text-gray-400 mb-2 pl-2 uppercase tracking-wider">${market}</h2>`;
                
                for (const [sector, companies] of Object.entries(sectors)) {
                    html += `
                        <details class="group mb-1">
                            <summary class="flex justify-between items-center font-medium cursor-pointer list-none p-2 rounded-lg hover:bg-blue-50 text-gray-700 transition-colors">
                                <span class="text-sm">${sector}</span>
                                <span class="transition group-open:rotate-180">
                                    <svg fill="none" height="16" shape-rendering="geometricPrecision" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewBox="0 0 24 24" width="16"><path d="M6 9l6 6 6-6"></path></svg>
                                </span>
                            </summary>
                            <div class="text-neutral-600 mt-1 mb-2 pl-4 flex flex-col border-l-2 border-blue-100 ml-3">
                    `;
                    for (const [name, ticker] of Object.entries(companies)) {
                        html += `<button onclick="fetchData('${name}', '${ticker}')" class="text-left py-1.5 px-3 text-sm hover:text-blue-600 hover:bg-blue-50 rounded-md transition-colors">${name}</button>`;
                    }
                    html += `</div></details>`;
                }
                html += `</div>`;
            }
            sidebar.innerHTML = html;
        }

        async function fetchData(name, ticker) {
            document.getElementById('current-company').innerText = name;
            document.getElementById('current-ticker').innerText = ticker;
            document.getElementById('metrics-container').innerHTML = '<div class="col-span-4 flex justify-center py-10"><div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div><span class="ml-3 text-blue-600 font-medium my-auto">데이터를 불러오는 중입니다...</span></div>';
            
            try {
                const response = await fetch(`${gasProxyUrl}?ticker=${ticker}`);
                if (!response.ok) throw new Error(`HTTP 통신 에러`);
                
                const json = await response.json();
                if (json.error) throw new Error(json.error);
                if (!json.quoteSummary || !json.quoteSummary.result) throw new Error(`데이터를 찾을 수 없습니다.`);
                
                const data = json.quoteSummary.result[0];
                const price = data.price || {};
                const fin = data.financialData || {};
                const stats = data.defaultKeyStatistics || {};

                // PER 수동 계산 로직
                let perValue = 'N/A';
                if (fin.trailingPE && fin.trailingPE.fmt) { perValue = fin.trailingPE.fmt; } 
                else if (price.regularMarketPrice?.raw && stats.trailingEps?.raw) { perValue = (price.regularMarketPrice.raw / stats.trailingEps.raw).toFixed(2); }

                currentStockData = {
                    name: name,
                    ticker: ticker,
                    price: price.regularMarketPrice?.fmt || 'N/A',
                    per: perValue,
                    pbr: stats.priceToBook?.fmt || 'N/A',
                    revenue: fin.totalRevenue?.fmt || 'N/A',
                    opMargin: fin.operatingMargins?.fmt || 'N/A',
                    netMargin: fin.profitMargins?.fmt || 'N/A',
                    debtRatio: fin.debtToEquity?.fmt || 'N/A',
                    peg: stats.pegRatio?.fmt || 'N/A'
                };

                updateUI();
            } catch (error) {
                document.getElementById('metrics-container').innerHTML = `<div class="col-span-4 text-center text-red-500 font-bold p-6 bg-red-50 rounded-xl border border-red-100">데이터 로드 실패: ${error.message}</div>`;
            }
        }

        function updateUI() {
            const d = currentStockData;
            
            document.getElementById('metrics-container').innerHTML = `
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500 flex flex-col justify-center">
                    <p class="text-sm text-gray-500 mb-1">현재가</p>
                    <p class="text-2xl font-bold text-gray-800">${d.price}</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-400 flex flex-col justify-center">
                    <p class="text-sm text-gray-500 mb-1">매출액</p>
                    <p class="text-2xl font-bold text-gray-800">${d.revenue}</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-teal-500 flex flex-col justify-center">
                    <p class="text-sm text-gray-500 mb-1">영업이익률</p>
                    <p class="text-2xl font-bold text-gray-800">${d.opMargin}</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-teal-400 flex flex-col justify-center">
                    <p class="text-sm text-gray-500 mb-1">순이익률</p>
                    <p class="text-2xl font-bold text-gray-800">${d.netMargin}</p>
                </div>
            `;

            document.getElementById('valuation-data').innerHTML = `
                <li class="flex justify-between border-b pb-3"><span class="text-gray-600">PER (주가수익비율)</span> <span class="font-bold text-gray-800">${d.per}</span></li>
                <li class="flex justify-between border-b pb-3 pt-1"><span class="text-gray-600">PBR (주가순자산비율)</span> <span class="font-bold text-gray-800">${d.pbr}</span></li>
                <li class="flex justify-between border-b pb-3 pt-1"><span class="text-gray-600">PEG (성장조정 PER)</span> <span class="font-bold text-gray-800">${d.peg}</span></li>
                <li class="flex justify-between pt-1"><span class="text-gray-600">부채비율 (Debt/Equity)</span> <span class="font-bold text-gray-800">${d.debtRatio}</span></li>
            `;
        }

        async function runAIAnalysis() {
            const apiKey = document.getElementById('apiKey').value;
            const output = document.getElementById('ai-output');
            
            if(!apiKey) return alert("우측 상단에 Gemini API Key를 입력해주세요.");
            if(!currentStockData.ticker) return alert("좌측 메뉴에서 종목을 먼저 선택해주세요.");

            output.innerHTML = '<div class="flex items-center text-purple-600"><div class="animate-spin rounded-full h-5 w-5 border-b-2 border-purple-600 mr-2"></div>AI가 기업 가치를 분석하고 있습니다...</div>';

            const prompt = `너는 퀀트 기반의 세계 최고의 주식 분석가야. 다음 한국 기업의 데이터를 보고 투자자에게 통찰력 있는 분석을 제공해줘. 
            기업: ${currentStockData.name}, PER: ${currentStockData.per}, PBR: ${currentStockData.pbr}, 영업이익률: ${currentStockData.opMargin}, 부채비율: ${currentStockData.debtRatio}, PEG: ${currentStockData.peg}.
            이 지표들이 의미하는 바와 동종 섹터 대비 현재 주가의 고평가/저평가 여부, 재무 건전성을 3문단으로 짧고 굵게 요약해.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                // 마크다운 형태를 간단히 HTML로 변환
                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/\*\*(.*?)\*\*/g, '<strong class="text-gray-900">$1</strong>');
                output.innerHTML = text;
            } catch(e) {
                output.innerHTML = `<span class="text-red-500">AI 분석 중 오류가 발생했습니다: ${e.message}</span>`;
            }
        }

        // 페이지 로드 시 사이드바 생성
        window.onload = renderSidebar;
    </script>
</body>
</html>
